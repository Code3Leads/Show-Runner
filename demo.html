<!DOCTYPE html>
<html>
<head>
  <title>Show Runner Demo | Code 3 Leads</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 30px 15px;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f172a;
      color: white;
      text-align: center;
    }

    h1 {
      margin-bottom: 5px;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      margin-top: 20px;
    }

    .phone {
      width: 340px;
      background: black;
      border-radius: 40px;
      padding: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,.4);
    }

    .screen {
      background: #f1f5f9;
      border-radius: 30px;
      height: 550px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      background: white;
      color: black;
      padding: 12px;
      font-weight: bold;
      border-bottom: 1px solid #ddd;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
    }

    .bubble {
      padding: 10px;
      border-radius: 15px;
      margin: 6px 0;
      max-width: 75%;
      text-align: left;
      white-space: pre-wrap;
    }

    .bot {
      background: #e5e7eb;
      color: black;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
    }

    .input-area {
      background: white;
      padding: 10px;
    }

    .input-area input {
      width: 65%;
      padding: 8px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      background: #e11d48;
      color: white;
    }

    .options button {
      display: block;
      width: 100%;
      margin-top: 5px;
      background: #1f2937;
    }
  </style>
</head>

<body>

<h1>Live Demo</h1>
<p>See both sides of the system in action</p>

<div class="container">

  <!-- CUSTOMER PHONE -->

  <div class="phone">
    <div class="screen">

      <div class="header">
        Customer
      </div>

      <div class="messages" id="chat"></div>

      <div class="input-area">

        <input id="input" placeholder="Describe your issue...">

        <button onclick="send()">
          Send
        </button>

        <div class="options" id="options">
          <button onclick="choose(1)">1. Emergency</button>
          <button onclick="choose(2)">2. Service Issue</button>
          <button onclick="choose(3)">3. Quote</button>
        </div>

      </div>

    </div>
  </div>

  <!-- CONTRACTOR PHONE -->

  <div class="phone">
    <div class="screen">

      <div class="header">
        Contractor
      </div>

      <div class="messages" id="contractorChat"></div>

    </div>
  </div>

</div>

<script>

let step = 0;
let selectedText = "";

window.onload = () => {

  bot("📞 Incoming Call...");

  setTimeout(() => {
    bot("❌ Missed Call");
  }, 1000);

  setTimeout(() => {
    bot(
      "Hey! Sorry we missed your call.\n\nWhat can we help you with?"
    );
  }, 2000);

};

function bot(text){

  let m = document.createElement("div");

  m.className = "bubble bot";

  m.innerText = text;

  chat.appendChild(m);

  chat.scrollTop = chat.scrollHeight;
}

function user(text){

  let m = document.createElement("div");

  m.className = "bubble user";

  m.innerText = text;

  chat.appendChild(m);

  chat.scrollTop = chat.scrollHeight;
}

function contractor(text){

  let m = document.createElement("div");

  m.className = "bubble bot";

  m.innerText = text;

  contractorChat.appendChild(m);

  contractorChat.scrollTop =
    contractorChat.scrollHeight;
}

function choose(option){

  if(option === 1){
    selectedText = "Emergency Service";
  }
  else if(option === 2){
    selectedText = "Service Issue";
  }
  else{
    selectedText = "Quote Request";
  }

  user(selectedText);

  document.getElementById("options").style.display =
    "none";

  setTimeout(() => {

    bot(
      "Please briefly describe the issue and include the address."
    );

    step = 1;

  }, 500);
}

function send(){

  let val =
    document.getElementById("input").value.trim();

  if(!val) return;

  if(step === 0){

    if(val === "1" || val === "2" || val === "3"){

      choose(parseInt(val));

      document.getElementById("input").value = "";

      return;
    }
  }

  user(val);

  document.getElementById("input").value = "";

  if(step === 1){

    let phoneInput = "(443) 555-1234";

    bot("⏳ Sending to contractor...");

    setTimeout(() => {

      contractor(
`🚨 NEW CUSTOMER REQUEST

Phone:
${phoneInput}

Service:
${selectedText}

Issue:
${val}`
      );

      bot("✅ Request submitted successfully.");

    }, 1200);

  }

}

</script>

</body>
</html>
